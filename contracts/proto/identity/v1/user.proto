syntax = "proto3";

package badminton.identity.v1;

import "identity/v1/auth.proto";
import "identity/v1/common.proto";

option go_package = "github.com/kainguyen/badminton-hub/contracts/gen/identity/v1;identityv1";

service IdentityUserService {
  rpc ListUsers(ListUsersRequest) returns (UserListResponse);
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (Empty);
}

message ListUsersRequest {
  string access_token = 1;
  int32 limit = 2;
  int32 offset = 3;
  string search = 4;
  string created_from = 5;
  string created_to = 6;
}
message UserListResponse { repeated UserResponse users = 1; }
message CreateUserRequest {
  string access_token = 1;
  string email = 2;
  string password = 3;
  string full_name = 4;
  string phone = 5;
}
message GetUserRequest {
  string access_token = 1;
  string user_id = 2;
}
message UpdateUserRequest {
  string access_token = 1;
  string user_id = 2;
  string email = 3;
  string full_name = 4;
  string phone = 5;
  string status = 6;
}
message DeleteUserRequest {
  string access_token = 1;
  string user_id = 2;
}
