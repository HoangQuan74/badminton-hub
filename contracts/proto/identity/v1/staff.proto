syntax = "proto3";
package badminton.identity.v1;
import "identity/v1/admin.proto";
import "identity/v1/common.proto";
option go_package = "github.com/kainguyen/badminton-hub/contracts/gen/identity/v1;identityv1";

service IdentityStaffService {
 rpc ListOrganizationStaff(ListOrganizationStaffRequest) returns (OrganizationStaffListResponse);
 rpc AddOrganizationStaff(AddOrganizationStaffRequest) returns (TenantStaffResponse);
 rpc RemoveOrganizationStaff(RemoveOrganizationStaffRequest) returns (Empty);
  rpc ListStaff(ListStaffRequest) returns (StaffListResponse);
  rpc CreateStaff(CreateStaffRequest) returns (StaffResponse);
  rpc GetStaff(GetStaffRequest) returns (StaffResponse);
  rpc UpdateStaff(UpdateStaffRequest) returns (StaffResponse);
  rpc DeleteStaff(DeleteStaffRequest) returns (Empty);
  rpc UpdateStaffAccess(UpdateStaffAccessRequest) returns (StaffResponse);
  rpc SetOrganizationStaff(TenantSetOrganizationStaffRequest) returns (TenantStaffResponse);
  rpc SetVenueStaff(TenantSetVenueStaffRequest) returns (TenantVenueStaffResponse);
}

message TenantSetOrganizationStaffRequest { string access_token = 1; string organization_id = 2; string user_id = 3; string role = 4; string status = 5; }
message TenantStaffResponse { string organization_id = 1; string user_id = 2; string role = 3; string status = 4; }
message TenantSetVenueStaffRequest { string access_token = 1; string venue_id = 2; string user_id = 3; string status = 4; }
message TenantVenueStaffResponse { string organization_id = 1; string venue_id = 2; string user_id = 3; string status = 4; }

message ListOrganizationStaffRequest { string access_token = 1; string organization_id = 2; }
message AddOrganizationStaffRequest { string access_token = 1; string organization_id = 2; string email = 3; string role = 4; }
message RemoveOrganizationStaffRequest { string access_token = 1; string organization_id = 2; string user_id = 3; }
message OrganizationStaffMember {
 string organization_id = 1; string user_id = 2; string role = 3; string status = 4;
 string email = 5; string full_name = 6; repeated string venue_ids = 7;
}
message OrganizationStaffListResponse { repeated OrganizationStaffMember items = 1; }
