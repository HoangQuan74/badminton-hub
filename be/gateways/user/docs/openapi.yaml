openapi: 3.0.3
info:
  title: BadmintonHub User Gateway API
  version: 1.0.0
  description: Public user routes exposed by the User Gateway; the Identity service is an internal gRPC owner.
servers:
  - url: /
tags:
  - name: Auth
    description: User registration and token operations.
  - name: Profile
    description: Current user profile.
paths:
  /api/v1/tenant/auth/login:
    post:
      operationId: tenantLogin
      tags: [Auth]
      description: Tenant operator login. Only tenant_owner and tenant_staff accounts are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated tenant operator and tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          description: Account is not a tenant operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User and session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user and tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/UserInactive'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Session revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
  /api/v1/tenant/auth/refresh:
    post:
      operationId: tenantRefresh
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated tenant session tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
  /api/v1/tenant/auth/logout:
    post:
      operationId: tenantLogout
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Tenant session revoked.
        '401':
          $ref: '#/components/responses/InvalidToken'
  /api/v1/tenant/me:
    get:
      operationId: getTenantOperator
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current tenant operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account is not a tenant operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 72, writeOnly: true}
        full_name: {type: string, maxLength: 120}
        phone: {type: string, maxLength: 20}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, writeOnly: true}
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string, writeOnly: true}
    User:
      type: object
      required: [id, email, full_name, phone, status, created_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        full_name: {type: string}
        phone: {type: string}
        status: {type: string, enum: [active, suspended]}
        created_at: {type: string, format: date-time}
        roles:
          type: array
          items: {type: string, enum: [customer, tenant_owner, tenant_staff]}
        is_admin: {type: boolean}
    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, access_expires_at, refresh_expires_at]
      properties:
        access_token: {type: string, writeOnly: true}
        refresh_token: {type: string, writeOnly: true}
        token_type: {type: string, enum: [Bearer]}
        access_expires_at: {type: string, format: date-time}
        refresh_expires_at: {type: string, format: date-time}
    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user: {$ref: '#/components/schemas/User'}
        tokens: {$ref: '#/components/schemas/Tokens'}
    RefreshResponse:
      type: object
      required: [tokens]
      properties:
        tokens: {$ref: '#/components/schemas/Tokens'}
    MeResponse:
      type: object
      required: [user]
      properties:
        user: {$ref: '#/components/schemas/User'}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
  responses:
    InvalidRequest:
      description: Invalid request data.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    EmailAlreadyRegistered:
      description: Email is already registered.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    InvalidCredentials:
      description: Credentials are invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    InvalidToken:
      description: Refresh token is invalid or expired.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    UserInactive:
      description: User is inactive.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Unauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    UserNotFound:
      description: User was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
