openapi: 3.0.3
info:
  title: BadmintonHub Admin Gateway API
  version: 1.0.0
  description: Public Admin Gateway routes backed by the private Identity gRPC service.
servers:
  - url: /
tags:
  - name: Admin Auth
    description: Administrator authentication and profile.
  - name: Staff
    description: Staff account management.
  - name: Role
    description: Role and role permission management.
  - name: Permission
    description: Permission management.
  - name: Tenant
    description: Tenant contacts and registration review.
security:
  - bearerAuth: []
paths:
  /api/v1/admin/auth/login:
    post:
      operationId: adminLogin
      tags: [Admin Auth]
      security: []
      responses:
        '200': {description: Authenticated staff.}
        '401': {description: Invalid credentials.}
  /api/v1/admin/auth/refresh:
    post:
      operationId: adminRefresh
      tags: [Admin Auth]
      security: []
      responses:
        '200': {description: Rotated staff tokens.}
        '401': {description: Invalid token.}
  /api/v1/admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [Admin Auth]
      responses:
        '204': {description: Session revoked.}
        '401': {description: Authentication required.}
  /api/v1/admin/me:
    get:
      operationId: adminMe
      tags: [Admin Auth]
      responses:
        '200': {description: Current staff and permissions.}
        '401': {description: Authentication required.}
  /api/v1/admin/me/password:
    put:
      operationId: changeAdminPassword
      tags: [Admin Auth]
      responses:
        '204': {description: Password changed.}
        '400': {description: Invalid request.}
        '401': {description: Authentication required.}
  /api/v1/admin/staff:
    get:
      operationId: listStaff
      tags: [Staff]
      responses:
        '200': {description: Staff list.}
        '403': {description: Permission denied.}
    post:
      operationId: createStaff
      tags: [Staff]
      responses:
        '201': {description: Staff created.}
        '400': {description: Invalid request.}
        '403': {description: Permission denied.}
  /api/v1/admin/staff/{staff_id}:
    parameters:
      - name: staff_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getStaff
      tags: [Staff]
      responses:
        '200': {description: Staff detail.}
        '404': {description: Staff not found.}
    put:
      operationId: updateStaff
      tags: [Staff]
      responses:
        '200': {description: Staff updated.}
        '403': {description: Permission denied.}
    delete:
      operationId: deleteStaff
      tags: [Staff]
      responses:
        '204': {description: Staff deleted.}
        '409': {description: Last admin cannot be deleted.}
  /api/v1/admin/staff/{staff_id}/access:
    parameters:
      - name: staff_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: updateStaffAccess
      tags: [Staff]
      responses:
        '200': {description: Staff access updated.}
        '403': {description: Admin permission required.}
        '409': {description: Last admin cannot be demoted.}
  /api/v1/admin/roles:
    get:
      operationId: listRoles
      tags: [Role]
      responses:
        '200': {description: Role list.}
    post:
      operationId: createRole
      tags: [Role]
      responses:
        '201': {description: Role created.}
        '403': {description: Admin permission required.}
  /api/v1/admin/roles/{role_id}:
    parameters:
      - name: role_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getRole
      tags: [Role]
      responses:
        '200': {description: Role detail.}
        '404': {description: Role not found.}
    put:
      operationId: updateRole
      tags: [Role]
      responses:
        '200': {description: Role updated.}
        '403': {description: Admin permission required.}
    delete:
      operationId: deleteRole
      tags: [Role]
      responses:
        '204': {description: Role deleted.}
        '409': {description: Role is in use.}
  /api/v1/admin/roles/{role_id}/permissions:
    parameters:
      - name: role_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: replaceRolePermissions
      tags: [Role]
      responses:
        '200': {description: Role permissions replaced.}
        '403': {description: Admin permission required.}
  /api/v1/admin/permissions/:
    get:
      operationId: listPermissions
      tags: [Permission]
      responses:
        '200':
          description: Permission catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items: {$ref: '#/components/schemas/Permission'}
        '403': {description: Active administrator required.}
    post:
      operationId: createPermission
      tags: [Permission]
      requestBody: {$ref: '#/components/requestBodies/PermissionInput'}
      responses:
        '201': {$ref: '#/components/responses/PermissionResponse'}
        '400': {description: Invalid permission.}
        '403': {description: Active administrator required.}
        '409': {description: Module, path and action already exist; code PERMISSION_ALREADY_EXISTS.}
  /api/v1/admin/permissions/{permission_id}:
    parameters:
      - {name: permission_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getPermission
      tags: [Permission]
      responses:
        '200': {$ref: '#/components/responses/PermissionResponse'}
        '403': {description: Active administrator required.}
        '404': {description: Permission not found; code PERMISSION_NOT_FOUND.}
    put:
      operationId: updatePermission
      tags: [Permission]
      requestBody: {$ref: '#/components/requestBodies/PermissionInput'}
      responses:
        '200': {$ref: '#/components/responses/PermissionResponse'}
        '400': {description: Invalid permission.}
        '403': {description: Active administrator required.}
        '404': {description: Permission not found; code PERMISSION_NOT_FOUND.}
        '409': {description: Module, path and action already exist; code PERMISSION_ALREADY_EXISTS.}
    delete:
      operationId: deletePermission
      tags: [Permission]
      responses:
        '204': {description: Permission deleted.}
        '403': {description: Active administrator required.}
        '404': {description: Permission not found; code PERMISSION_NOT_FOUND.}
  /api/v1/admin/tenants:
    get:
      operationId: listTenantRegistrations
      tags: [Tenant]
      description: Active administrator only. Returns organizations with their registration contact details and latest review information.
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [PENDING_VERIFICATION, ACTIVE, REJECTED, SUSPENDED, ARCHIVED]}
      responses:
        '200':
          description: Tenant review queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TenantRegistration'}
        '400': {description: Invalid status filter.}
        '403': {description: Active administrator required.}
  /api/v1/admin/tenants/{organization_id}/approve:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      operationId: approveTenantRegistration
      tags: [Tenant]
      description: Changes PENDING_VERIFICATION to ACTIVE and records the reviewer and note atomically. Repeating the same decision returns the existing result without a second review record.
      requestBody: {$ref: '#/components/requestBodies/TenantReviewInput'}
      responses:
        '200': {$ref: '#/components/responses/TenantRegistrationResponse'}
        '400': {description: Invalid identifier or note.}
        '403': {description: Active administrator required.}
        '404': {description: Tenant not found; code TENANT_NOT_FOUND.}
        '409': {description: Conflicting decision or non-pending organization; code TENANT_STATE_CONFLICT.}
  /api/v1/admin/tenants/{organization_id}/reject:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      operationId: rejectTenantRegistration
      tags: [Tenant]
      description: Changes PENDING_VERIFICATION to REJECTED and records the reviewer and note atomically. Repeating the same decision returns the existing result.
      requestBody: {$ref: '#/components/requestBodies/TenantReviewInput'}
      responses:
        '200': {$ref: '#/components/responses/TenantRegistrationResponse'}
        '400': {description: Invalid identifier or note.}
        '403': {description: Active administrator required.}
        '404': {description: Tenant not found; code TENANT_NOT_FOUND.}
        '409': {description: Conflicting decision or non-pending organization; code TENANT_STATE_CONFLICT.}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  requestBodies:
    PermissionInput:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PermissionInput'}
    TenantReviewInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              note: {type: string, maxLength: 1000}
          example: {note: Contact details verified.}
  responses:
    PermissionResponse:
      description: Permission details.
      content:
        application/json:
          schema:
            type: object
            properties:
              permission: {$ref: '#/components/schemas/Permission'}
    TenantRegistrationResponse:
      description: Reviewed tenant registration.
      content:
        application/json:
          schema:
            type: object
            properties:
              registration: {$ref: '#/components/schemas/TenantRegistration'}
  schemas:
    PermissionInput:
      type: object
      required: [module, path, action]
      properties:
        module: {type: string, maxLength: 100, description: Trimmed and lowercased.}
        path: {type: string, maxLength: 300}
        action: {type: string, enum: [CREATE, READ, UPDATE, DELETE]}
        description: {type: string, maxLength: 500}
    Permission:
      allOf:
        - {$ref: '#/components/schemas/PermissionInput'}
        - type: object
          properties:
            id: {type: string, format: uuid}
    TenantRegistration:
      type: object
      properties:
        organization:
          type: object
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
            slug: {type: string}
            status: {type: string, enum: [PENDING_VERIFICATION, ACTIVE, REJECTED, SUSPENDED, ARCHIVED]}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
        contact_name: {type: string}
        contact_email: {type: string}
        contact_phone: {type: string}
        note: {type: string}
        review_decision: {type: string}
        review_note: {type: string}
        reviewer_id: {type: string}
        reviewed_at: {type: string, description: RFC3339 timestamp when reviewed; omitted or empty for pending registrations.}
