version: "2"

sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "storage/query"
    gen:
      go:
        package: "db"
        out: "storage/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.timestamptz"
            nullable: false
            go_type:
              import: "time"
              type: "Time"
