name: badminton-hub

services:
  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB:-badminton_identity}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${IDENTITY_POSTGRES_PORT:-15432}:5432"
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  identity-redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${IDENTITY_REDIS_PORT:-16379}:6379"
    volumes:
      - identity_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  gateway-redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${GATEWAY_REDIS_PORT:-16380}:6379"
    volumes:
      - gateway_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    ports:
      - "${MONGODB_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ../../be/services/identity/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=${IDENTITY_DATABASE_URL:-postgres://postgres:postgres@identity-db:5432/badminton_identity?sslmode=disable}
      - up
    depends_on:
      identity-db:
        condition: service_healthy
    restart: "no"

  seed:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ../../be/services/identity/seed/dev.sql:/seed.sql:ro
    command:
      - sh
      - -c
      - psql -h identity-db -U ${POSTGRES_USER:-postgres} -d ${IDENTITY_POSTGRES_DB:-badminton_identity} -v ON_ERROR_STOP=1 -f /seed.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  identity:
    build:
      context: ../..
      dockerfile: devops/docker/identity.Dockerfile
    environment:
      APP_ENV: local
      IDENTITY_HTTP_ADDR: :8080
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL:-postgres://postgres:postgres@identity-db:5432/badminton_identity?sslmode=disable}
      IDENTITY_REDIS_URL: ${IDENTITY_REDIS_URL:-redis://identity-redis:6379/1}
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:-local-only-secret-change-before-production-123456}
      IDENTITY_ACCESS_TOKEN_TTL: ${IDENTITY_ACCESS_TOKEN_TTL:-15m}
      IDENTITY_REFRESH_TOKEN_TTL: ${IDENTITY_REFRESH_TOKEN_TTL:-168h}
      IDENTITY_SHUTDOWN_TIMEOUT: 10s
      IDENTITY_DATABASE_PING_TIMEOUT: 5s
      IDENTITY_DEPENDENCY_TIMEOUT: 5s
      # Legacy names remain for rollback to a pre-extraction API image.
      DATABASE_URL: ${IDENTITY_DATABASE_URL:-postgres://postgres:postgres@identity-db:5432/badminton_identity?sslmode=disable}
      REDIS_URL: redis://identity-redis:6379/0
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-badminton_hub}
      JWT_SECRET: ${IDENTITY_JWT_SECRET:-local-only-secret-change-before-production-123456}
      ACCESS_TOKEN_TTL: ${IDENTITY_ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${IDENTITY_REFRESH_TOKEN_TTL:-168h}
      SHUTDOWN_TIMEOUT: 10s
      DATABASE_PING_TIMEOUT: 5s
      DEPENDENCY_TIMEOUT: 5s
    ports:
      - "${IDENTITY_PORT:-18081}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
      identity-redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    init: true
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: devops/docker/api.Dockerfile
    environment:
      APP_ENV: local
      GATEWAY_HTTP_ADDR: :8080
      GATEWAY_IDENTITY_URL: http://identity:8080
      GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:-redis://gateway-redis:6379/0}
      GATEWAY_SHUTDOWN_TIMEOUT: 10s
      GATEWAY_DEPENDENCY_TIMEOUT: 5s
      # Keep legacy dependencies available so a pre-extraction API image can
      # be rolled back without changing the Compose contract.
      HTTP_ADDR: :8080
      IDENTITY_URL: http://identity:8080
      DATABASE_URL: ${IDENTITY_DATABASE_URL:-postgres://postgres:postgres@identity-db:5432/badminton_identity?sslmode=disable}
      REDIS_URL: ${GATEWAY_REDIS_URL:-redis://gateway-redis:6379/0}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-badminton_hub}
      JWT_SECRET: ${IDENTITY_JWT_SECRET:-local-only-secret-change-before-production-123456}
      ACCESS_TOKEN_TTL: ${IDENTITY_ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${IDENTITY_REFRESH_TOKEN_TTL:-168h}
      SHUTDOWN_TIMEOUT: 10s
      DATABASE_PING_TIMEOUT: 5s
      DEPENDENCY_TIMEOUT: 5s
    ports:
      - "${API_PORT:-18080}:8080"
    depends_on:
      identity:
        condition: service_healthy
      identity-db:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    init: true
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: devops/docker/web.Dockerfile
      args:
        VITE_API_URL: /
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  identity_postgres_data:
  identity_redis_data:
  gateway_redis_data:
  mongodb_data:
