name: badminton-hub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB:-badminton_identity}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    ports:
      - "${MONGODB_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  kafka:
    image: redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --mode=dev-container
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:${KAFKA_PORT:-19093}
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:${KAFKA_PORT:-19093}
      - --rpc-addr=kafka:33145
      - --advertise-rpc-addr=kafka:33145
    ports:
      - "${KAFKA_PORT:-19093}:19092"
    volumes:
      - kafka_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    init: true
    restart: unless-stopped

  kafka-init:
    image: redpandadata/redpanda:v24.3.6
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in booking.events payment.events notification.commands payout.events; do
          if ! rpk topic describe "$$topic" -X brokers=kafka:9092 >/dev/null 2>&1; then
            rpk topic create "$$topic" --partitions 3 --replicas 1 -X brokers=kafka:9092
          fi
        done
    restart: "no"

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ../../be/services/identity/internal/storage/postgres/schema/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=${IDENTITY_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/badminton_identity?sslmode=disable}
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ../../be/services/identity/internal/storage/postgres/schema/seed/dev.sql:/seed.sql:ro
    command:
      - sh
      - -c
      - psql -h postgres -U ${POSTGRES_USER:-postgres} -d ${IDENTITY_POSTGRES_DB:-badminton_identity} -v ON_ERROR_STOP=1 -f /seed.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  identity:
    build:
      context: ../..
      dockerfile: devops/docker/identity.Dockerfile
    environment:
      APP_ENV: local
      IDENTITY_GRPC_ADDR: :9091
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/badminton_identity?sslmode=disable}
      IDENTITY_REDIS_URL: ${IDENTITY_REDIS_URL:-redis://redis:6379/1}
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:-local-only-secret-change-before-production-123456}
      IDENTITY_ACCESS_TOKEN_TTL: ${IDENTITY_ACCESS_TOKEN_TTL:-15m}
      IDENTITY_REFRESH_TOKEN_TTL: ${IDENTITY_REFRESH_TOKEN_TTL:-168h}
      IDENTITY_SHUTDOWN_TIMEOUT: 10s
      IDENTITY_DATABASE_PING_TIMEOUT: 5s
      IDENTITY_DEPENDENCY_TIMEOUT: 5s
      # Legacy names remain for rollback to a pre-extraction API image.
      DATABASE_URL: ${IDENTITY_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/badminton_identity?sslmode=disable}
      REDIS_URL: redis://redis:6379/0
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-badminton_hub}
      JWT_SECRET: ${IDENTITY_JWT_SECRET:-local-only-secret-change-before-production-123456}
      ACCESS_TOKEN_TTL: ${IDENTITY_ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${IDENTITY_REFRESH_TOKEN_TTL:-168h}
      SHUTDOWN_TIMEOUT: 10s
      DATABASE_PING_TIMEOUT: 5s
      DEPENDENCY_TIMEOUT: 5s
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9091"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    init: true
    restart: unless-stopped

  user-gateway:
    build:
      context: ../..
      dockerfile: devops/docker/user-gateway.Dockerfile
    environment:
      APP_ENV: local
      USER_GATEWAY_HTTP_ADDR: :8080
      USER_GATEWAY_IDENTITY_GRPC_TARGET: ${USER_GATEWAY_IDENTITY_GRPC_TARGET:-identity:9091}
      USER_GATEWAY_SHUTDOWN_TIMEOUT: 10s
      USER_GATEWAY_DEPENDENCY_TIMEOUT: 5s
      USER_GATEWAY_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}
      GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${API_PORT:-18080}:8080"
    depends_on:
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    init: true
    restart: unless-stopped

  admin-gateway:
    build:
      context: ../..
      dockerfile: devops/docker/admin-gateway.Dockerfile
    profiles: ["admin"]
    environment:
      ADMIN_GATEWAY_HTTP_ADDR: :8080
      ADMIN_GATEWAY_IDENTITY_GRPC_TARGET: ${ADMIN_GATEWAY_IDENTITY_GRPC_TARGET:-identity:9091}
      ADMIN_GATEWAY_SHUTDOWN_TIMEOUT: 10s
      ADMIN_GATEWAY_DEPENDENCY_TIMEOUT: 5s
      ADMIN_GATEWAY_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}
    ports:
      - "${ADMIN_GATEWAY_PORT:-18082}:8080"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
    init: true
    restart: unless-stopped

  socket-gateway:
    build:
      context: ../..
      dockerfile: devops/docker/socket-gateway.Dockerfile
    profiles: ["socket"]
    environment:
      SOCKET_GATEWAY_HTTP_ADDR: :8080
      SOCKET_GATEWAY_GRPC_TARGET: ${SOCKET_GATEWAY_GRPC_TARGET:-socket:9093}
      SOCKET_GATEWAY_SHUTDOWN_TIMEOUT: 10s
      SOCKET_GATEWAY_DEPENDENCY_TIMEOUT: 5s
      SOCKET_GATEWAY_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}
    ports:
      - "${SOCKET_GATEWAY_PORT:-18083}:8080"
    depends_on:
      socket:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
    init: true
    restart: unless-stopped

  socket:
    build:
      context: ../..
      dockerfile: devops/docker/socket.Dockerfile
    profiles: ["socket"]
    environment:
      SOCKET_GRPC_ADDR: :9093
      SOCKET_JWT_SECRET: ${IDENTITY_JWT_SECRET:-local-only-secret-change-before-production-123456}
      SOCKET_REDIS_URL: ${SOCKET_REDIS_URL:-redis://redis:6379/2}
      SOCKET_REDIS_CHANNEL: ${SOCKET_REDIS_CHANNEL:-badminton:realtime}
      SOCKET_SHUTDOWN_TIMEOUT: 10s
      SOCKET_DEPENDENCY_TIMEOUT: 5s
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9093"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    init: true
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: devops/docker/web.Dockerfile
      args:
        VITE_API_URL: /
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      user-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  kafka_data:
