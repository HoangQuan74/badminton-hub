services:
  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ../../../be/services/identity/internal/storage/postgres/schema/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=${IDENTITY_DATABASE_URL}", "up"]
    restart: "no"

  identity:
    image: ${IDENTITY_IMAGE:?IDENTITY_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      IDENTITY_GRPC_ADDR: :9091
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL:?IDENTITY_DATABASE_URL is required}
      IDENTITY_REDIS_URL: ${IDENTITY_REDIS_URL:?IDENTITY_REDIS_URL is required}
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:?IDENTITY_JWT_SECRET is required}
      IDENTITY_ACCESS_TOKEN_TTL: ${IDENTITY_ACCESS_TOKEN_TTL:-15m}
      IDENTITY_REFRESH_TOKEN_TTL: ${IDENTITY_REFRESH_TOKEN_TTL:-168h}
      IDENTITY_SHUTDOWN_TIMEOUT: 15s
      IDENTITY_DATABASE_PING_TIMEOUT: 5s
      IDENTITY_DEPENDENCY_TIMEOUT: 5s
      # Legacy names remain for rollback to a pre-extraction API image.
      DATABASE_URL: ${IDENTITY_DATABASE_URL:?IDENTITY_DATABASE_URL is required}
      REDIS_URL: ${IDENTITY_REDIS_URL:?IDENTITY_REDIS_URL is required}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-badminton_hub}
      JWT_SECRET: ${IDENTITY_JWT_SECRET:?IDENTITY_JWT_SECRET is required}
      ACCESS_TOKEN_TTL: ${IDENTITY_ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${IDENTITY_REFRESH_TOKEN_TTL:-168h}
      SHUTDOWN_TIMEOUT: 15s
      DATABASE_PING_TIMEOUT: 5s
      DEPENDENCY_TIMEOUT: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9091"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?API_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      USER_GATEWAY_HTTP_ADDR: :8080
      USER_GATEWAY_IDENTITY_GRPC_TARGET: ${USER_GATEWAY_IDENTITY_GRPC_TARGET:-identity:9091}
      USER_GATEWAY_SHUTDOWN_TIMEOUT: 15s
      GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:?GATEWAY_REDIS_URL is required}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
